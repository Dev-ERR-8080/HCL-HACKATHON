server.port=8080
spring.application.name=ag-service

jwt.secret=mysecretkeymysecretkeymysecretkey12

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ??? Gateway Routes ???????????????????????????????????????????
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
# ? FIXED: also proxy /login/oauth2/** so Google's redirect goes through
#    the gateway (8080) instead of hitting auth-service (8081) directly.
#    This means the JWT cookie is set on localhost:8080 ? the same origin
#    the frontend uses ? so it gets sent on every subsequent request.
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/oauth2/**,/login/**

spring.cloud.gateway.routes[1].id=booking-service
spring.cloud.gateway.routes[1].uri=lb://booking-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[2].id=hotel-catalog-service
spring.cloud.gateway.routes[2].uri=lb://hotel-catalog-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/hotels/**

spring.cloud.gateway.routes[3].id=profile-service
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/profile/**

management.endpoints.web.exposure.include=health,info

# ? Route 4: Coupons (public ? no login needed to validate a coupon)
spring.cloud.gateway.routes[4].id=coupon-service
spring.cloud.gateway.routes[4].uri=lb://booking-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/coupons/**